[project]
name = "ophello"
version = "0.1.0"
description = "Read 1Password op:// secrets through Windows Hello"
readme = "README.md"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ophello"]

[tool.hatch.build.targets.wheel.sources]
"src/ophello" = "ophello"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
