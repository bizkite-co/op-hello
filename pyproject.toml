[project]
name = "ophello"
version = "0.2.1"
description = "Portable 1Password op:// secret reader with Windows Hello support"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
op-hello = "ophello.cli:main"

[project.optional-dependencies]
sdk = ["onepassword-sdk>=0.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ophello"]

[tool.hatch.build.targets.wheel.sources]
"src/ophello" = "ophello"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"bin/op-hello" = "ophello/bin/op-hello"
"windows/op-read.ps1" = "ophello/windows/op-read.ps1"
"windows/ahk-pause.ps1" = "ophello/windows/ahk-pause.ps1"
