[project]
name = "op-hello"
version = "0.2.3"
description = "Portable 1Password op:// secret reader with Windows Hello support"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
op-hello = "op_hello.cli:main"

[project.optional-dependencies]
sdk = ["onepassword-sdk>=0.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/op_hello"]

[tool.hatch.build.targets.wheel.sources]
"src/op_hello" = "op_hello"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"bin/op-hello" = "op_hello/bin/op-hello"
"windows/op-read.ps1" = "op_hello/windows/op-read.ps1"
"windows/ahk-pause.ps1" = "op_hello/windows/ahk-pause.ps1"
